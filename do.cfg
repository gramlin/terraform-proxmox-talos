# do.cfg - Configuration for Talos+Proxmox cluster deployment
# Copy this file to do.local.cfg for local overrides (ignored by git)
#
# Usage:
#   - Edit settings below
#   - Run: ./do apply
#
# All settings have sensible defaults. Only change what you need.

# ============================================
# CLUSTER PROFILE
# ============================================
# Choose a deployment profile:
#   full    - Traefik ingress + Harbor + Monitoring (default)
#   simple  - Cilium ingress only (minimal resources)
#   custom  - Use individual component toggles below
PROFILE="full"

# ============================================
# COMPONENT TOGGLES
# ============================================
# These are auto-set based on PROFILE, but can be overridden

# Run Terraform (set to false to skip infrastructure provisioning)
RUN_TERRAFORM="true"

# Install Piraeus/LINSTOR storage
INSTALL_PIRAEUS="true"

# Ingress controller: "traefik" or "cilium"
# - traefik: Full-featured ingress with dashboard, middleware, IngressRoutes
# - cilium: Lightweight, uses Cilium's built-in ingress controller
INGRESS_CONTROLLER="traefik"

# Additional components
INSTALL_HARBOR="true"
INSTALL_MONITORING="false"
INSTALL_GITEA="false"

# ============================================
# NETWORK CONFIGURATION
# ============================================
# Domain for ingress (used for all services)
INGRESS_DOMAIN="cure.dev"

# LoadBalancer IP range (Cilium L2 IPAM)
# Leave empty to use terraform variables
LB_IP_START=""
LB_IP_END=""

# ============================================
# PIRAEUS / LINSTOR
# ============================================
# Piraeus Operator version
PIRAEUS_OPERATOR_VERSION="2.10.4"

# LINSTOR image version (note: requires 'v' prefix)
LINSTOR_IMAGE_VERSION="v1.32.3"

# Storage pool name
STORAGE_POOL_NAME="lvm"

# StorageClass name
STORAGE_CLASS_NAME="linstor-lvm-r1"

# Number of replicas for volumes (autoPlace)
STORAGE_REPLICAS="1"

# Default disk device for LVM (Talos workers)
DEFAULT_DEVICE="/dev/sdb"

# Per-node device overrides (comma-separated: node1=/dev/sdb,node2=/dev/vdb)
DEVICE_MAP=""

# ============================================
# TRAEFIK (when INGRESS_CONTROLLER=traefik)
# ============================================
TRAEFIK_VERSION="33.2.1"
TRAEFIK_REPLICAS="2"

# ============================================
# HARBOR
# ============================================
HARBOR_VERSION="1.16.2"
HARBOR_ADMIN_PASSWORD="Harbor12345"
HARBOR_REGISTRY_SIZE="50Gi"

# ============================================
# MONITORING (Prometheus + Grafana)
# ============================================
MONITORING_VERSION="72.6.2"
GRAFANA_ADMIN_PASSWORD="admin"
PROMETHEUS_RETENTION="15d"
PROMETHEUS_STORAGE_SIZE="20Gi"

# ============================================
# GITEA
# ============================================
GITEA_VERSION="10.6.0"
GITEA_ADMIN_PASSWORD="gitea12345"

# ============================================
# TIMEOUTS
# ============================================
WAIT_LINSTOR_TIMEOUT="15m"
WAIT_SATELLITE_TIMEOUT="2m"
WAIT_STORAGEPOOL_TIMEOUT="15m"

# ============================================
# DANGER ZONE
# ============================================
# Wipe data disks on workers (DESTRUCTIVE!)
WIPE_DISKS="false"

# Auto-reset LINSTOR DB on migration failures
AUTO_RESET_LINSTOR_DB="false"

# Enable debug logging to file
LOG_ENABLED="false"
LOG_FILE="do.log"

# ============================================
# ADVANCED
# ============================================
# Terraform var file (optional, auto-detected)
TF_VAR_FILE=""

# Fallback to older Piraeus versions on image pull failures
PIRAEUS_VERSION_FALLBACK="true"
